<section class="create-category-modal">
  <h2 mat-dialog-title>Нова категорія</h2>

  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Назва категорії</mat-label>
      <input matInput [(ngModel)]="draft.name" />
    </mat-form-field>

    <label class="flag-field">
      <input type="checkbox" [(ngModel)]="draft.isActive" />
      Активна
    </label>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="close()">Скасувати</button>
    <button mat-raised-button color="primary" [disabled]="!draft.name.trim()" (click)="save()">Додати</button>
  </mat-dialog-actions>
</section>
