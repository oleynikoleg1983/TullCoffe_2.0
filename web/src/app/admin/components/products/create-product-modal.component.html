<section class="create-product-modal">
  <h2 mat-dialog-title>Новий товар</h2>

  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Назва</mat-label>
      <input matInput [(ngModel)]="draft.name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Опис</mat-label>
      <input matInput [(ngModel)]="draft.description" />
    </mat-form-field>

    <div class="numbers-row">
      <mat-form-field appearance="outline">
        <mat-label>Ціна</mat-label>
        <input matInput type="number" min="0" step="0.01" [(ngModel)]="draft.price" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Категорія ID</mat-label>
        <input matInput type="number" min="0" step="1" [(ngModel)]="draft.categoryId" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>User Salary</mat-label>
        <input matInput type="number" min="0" step="0.01" [(ngModel)]="draft.userSalary" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Sort Order</mat-label>
        <input matInput type="number" min="0" step="1" [(ngModel)]="draft.sortOrder" />
      </mat-form-field>
    </div>

    <div class="flags-row">
      <label>
        <input type="checkbox" [(ngModel)]="draft.isActive" /> is_active
      </label>
      <label>
        <input type="checkbox" [(ngModel)]="draft.isDeleted" /> is_deleted
      </label>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="close()">Скасувати</button>
    <button mat-raised-button color="primary" [disabled]="!draft.name.trim()" (click)="save()">Додати</button>
  </mat-dialog-actions>
</section>
