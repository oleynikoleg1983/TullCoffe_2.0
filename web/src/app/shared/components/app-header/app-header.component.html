<header class="app-header">
  @if (currentUser) {
    <div class="user-menu-wrapper">
      <button
        type="button"
        class="user-chip"
        aria-label="Current user menu"
        [attr.aria-expanded]="isUserMenuOpen"
        (click)="toggleUserMenu($event)"
      >
        <svg class="user-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 12c2.76 0 5-2.24 5-5S14.76 2 12 2 7 4.24 7 7s2.24 5 5 5Zm0 2c-3.33 0-10 1.67-10 5v2h20v-2c0-3.33-6.67-5-10-5Z"
          />
        </svg>
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="menu-caret" aria-hidden="true">▾</span>
      </button>

      @if (isUserMenuOpen) {
        <div class="user-dropdown" role="menu" aria-label="User actions">
          <button type="button" class="dropdown-item" role="menuitem" (click)="logout()">{{'Exit'}}</button>
        </div>
      }
    </div>
  }

  @if (isAdmin$ | async) {
    <app-navigation-buttons></app-navigation-buttons>
  }
</header>
