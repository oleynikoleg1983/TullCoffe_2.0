<div>
    <h2 mat-dialog-title>{{ data.product.name }}</h2>
    <mat-dialog-content>
        <p>{{ data.product.description }}</p>
        <p>
            <strong>Price:</strong>
            {{ data.product.price }} UAH
        </p>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Quantity</mat-label>

            <input
            matInput
            type="number"
            min="1"
            [(ngModel)]="quantity">
        </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button
            mat-raised-button
            color="primary"
            (click)="apply()">
            Apply
        </button>
        <button
            mat-button
            (click)="close()">
            Cancel
        </button>
    </mat-dialog-actions>
</div>
